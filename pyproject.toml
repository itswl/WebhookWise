[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "real_httpx: allow a test to use the real httpx client instead of the default mock",
  "real_network: allow a test to use real outbound HTTP libraries",
  "real_redis: allow a test to use a real Redis client instead of the default mock",
  "real_services: allow a test to opt out of default external-service mocks",
]

[tool.coverage.run]
source = ["core", "api", "services", "models", "adapters", "db", "contracts"]
omit = ["tests/*", "alembic/*", "scripts/*"]
# Measure branch coverage, not just line coverage: error/degradation branches
# dominate this codebase and line-only coverage doesn't prove both sides are
# exercised.
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Ratchet: branch coverage is currently ~87%. The gate is set just below the
# current value to prevent regressions; raise it incrementally as branch
# coverage improves (target 90%+). Do NOT lower it.
fail_under = 85

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
files = ["."]
exclude = [
  "^docs/",
  "^tests/",
  "^scripts/",
  "^templates/",
  "^alembic/",
  "^postgres_data/",
  "^\\.venv/",
  "^\\.tox/",
]

[[tool.mypy.overrides]]
module = [
  "opentelemetry.*",
  "pyroscope.*",
  "asyncpg.*",
  "instructor",
  "uvloop",
  "gunicorn.*",
  "pycron",
]
ignore_missing_imports = true
