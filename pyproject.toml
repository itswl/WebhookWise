[project]
name = "webhookwise"
version = "0.1.1"
description = "Webhook ingestion, analysis, forwarding, and observability service."
# Runtime images and CI run 3.14; the SOURCE floor stays 3.12 so the code
# remains portable (and so ruff does not rewrite it into 3.14-only syntax
# like PEP 758 unparenthesized except — which would strand any 3.12 venv).
requires-python = ">=3.12"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "B", "UP", "SIM", "F", "C4", "PIE", "PERF", "E", "W", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/*.py" = ["B008"]
# PLC0415 ratchet: every file below already had a function-body import when the rule was turned on (245 files), and none of them is breaking a real cycle — delete entries as imports move to the top, never add one.
