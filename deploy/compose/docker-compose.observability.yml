# Optional local observability stack. Start the business stack first with:
#   docker compose up -d
#
# Then start observability in a separate Compose project:
#   docker compose -p webhookwise-observability --env-file .env -f deploy/compose/docker-compose.observability.yml up -d
# BEFORE FIRST START, write the alertmanager bypass file. Its chat-direct
# receiver reads a URL from a FILE, not an env var: alertmanager does not expand
# dollar-brace references in its config and Compose does not substitute inside a
# bind-mounted file, so the env form was read literally and it refused to start
# with `unsupported scheme ""`. It survived three weeks on a config loaded before
# that change and died the next time it was recreated.
#
#   printf '%s' "$ALERT_BYPASS_WEBHOOK_URL" > deploy/observability/alertmanager/bypass-url
#   chmod 644 deploy/observability/alertmanager/bypass-url
#
# Git-ignored: it carries a chat webhook token. Missing, Docker creates a
# directory there and alertmanager crash-loops — loud, which is the right failure
# for a bypass route that exists for the outage nobody would notice a quiet one in.
#
# Add --profile diagnostics only while investigating traces, profiles, or eBPF signals:
#   docker compose -p webhookwise-observability --env-file .env -f deploy/compose/docker-compose.observability.yml --profile diagnostics up -d
#   docker compose -p webhookwise-observability --env-file .env -f deploy/compose/docker-compose.observability.yml --profile load run --rm k6

name: webhookwise-observability

# Container log rotation. Docker's json-file driver has NO default limit, so every
# container here grows a log file until the disk fills. Measured on the production
# host: 2.5 GB of container logs, loki at 15 MB/day and pyroscope at 13 MB/day —
# the log aggregator's own logs were the second-largest log file on the box, and
# 63% of Grafana's lines were one message repeating every 30 seconds.
#
# 10m x 3 caps each service at 30 MB. Kept small deliberately: these files are the
# copy of last resort. Alloy already ships logs to Loki, so anything worth keeping
# is kept there, and what remains here is what you read when Loki is what broke.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  alloy:
    logging: *default-logging
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    # A ceiling the process can actually hit, so memory_limiter's soft limit
    # means something relative to a real bound. It had none: the limiter was
    # refusing batches at 192MiB while the container was free to take the
    # host's 11.6GiB. Steady state after the config fix is ~66MiB, so 1.5GiB
    # is room to absorb a burst and still stop a runaway.
    mem_limit: 1536m
    mem_reservation: 256m
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - webhook_net

  prometheus:
    logging: *default-logging
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms,exemplar-storage
    volumes:
      - ../../deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../deploy/observability/prometheus/alerts.yml:/etc/prometheus/rules/webhookwise-alerts.yml:ro
      # hookrelay scrape credential: gitignored, written per host. Absent on a
      # stack without a relay — Prometheus then fails only that one scrape.
      - ../../deploy/observability/prometheus/hookrelay.token:/etc/prometheus/hookrelay.token:ro
      - ../../deploy/observability/prometheus/hookjudge.token:/etc/prometheus/hookjudge.token:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - webhook_net
      - hookstack_net

  alertmanager:
    logging: *default-logging
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.32.1}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../../deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Written by the deploy from ALERT_BYPASS_WEBHOOK_URL; git-ignored because
      # it carries a chat webhook token. If it is missing Docker creates a
      # DIRECTORY here and alertmanager refuses to start — loud, which is the
      # right failure for a bypass path, but create the file before deploying.
      - ../../deploy/observability/alertmanager/bypass-url:/etc/alertmanager/bypass-url:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - webhook_net

  # NOTE: Beyla binds to the app container's PID namespace at start; after the
  # app container is RECREATED (deploy), the running Beyla stays attached to
  # the dead namespace and silently stops observing — restart it:
  #   docker compose --profile diagnostics restart beyla
  beyla:
    logging: *default-logging
    image: ${BEYLA_IMAGE:-grafana/beyla:3.15.0}
    restart: unless-stopped
    profiles:
      - diagnostics
    command: ["-config", "/etc/beyla/config.yml"]
    pid: "container:webhook-receiver"
    privileged: true
    environment:
      BEYLA_CONFIG_PATH: /etc/beyla/config.yml
    volumes:
      - ../../deploy/observability/beyla/config.yml:/etc/beyla/config.yml:ro
      # Beyla uses bpffs pinned maps for log enrichment and profile correlation.
      # The host path must be an existing read-write BPF filesystem mount.
      - /sys/fs/bpf:/sys/fs/bpf
    depends_on:
      alloy:
        condition: service_started
    networks:
      - webhook_net

  k6:
    logging: *default-logging
    image: ${K6_IMAGE:-grafana/k6:2.0.0}
    profiles:
      - load
    environment:
      BASE_URL: ${K6_BASE_URL:-http://webhook-service:8000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-please-change-webhook-secret}
      K6_RUN_ID: ${K6_RUN_ID:-}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,min,max
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    volumes:
      - ../../tests/k6:/scripts:ro
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/webhook_smoke.js"]
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - webhook_net

  pyroscope:
    logging: *default-logging
    image: ${PYROSCOPE_IMAGE:-grafana/pyroscope:2.0.2}
    restart: unless-stopped
    profiles:
      - diagnostics
    command: ["server"]
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    ports:
      - "4040:4040"
    networks:
      - webhook_net

  tempo:
    logging: *default-logging
    image: ${TEMPO_IMAGE:-grafana/tempo:2.10.5}
    restart: unless-stopped
    profiles:
      - diagnostics
    user: "0:0"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../../deploy/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - webhook_net

  loki:
    logging: *default-logging
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ../../deploy/observability/loki/loki.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - webhook_net

  grafana:
    logging: *default-logging
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.0.1}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../../deploy/observability/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../../deploy/observability/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      alloy:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - webhook_net

volumes:
  alertmanager_data:
    name: webhookwise_alertmanager_data
  alloy_data:
    name: webhookwise_alloy_data
  grafana_data:
    name: webhookwise_grafana_data
  loki_data:
    name: webhookwise_loki_data
  prometheus_data:
    name: webhookwise_prometheus_data
  pyroscope_data:
    name: webhookwise_pyroscope_data
  tempo_data:
    name: webhookwise_tempo_data

networks:
  webhook_net:
    name: webhookwise_webhook_net
    external: true
  # Owned by the app compose; prometheus joins to scrape the investigator.
  hookstack_net:
    name: hookstack_net
    external: true
