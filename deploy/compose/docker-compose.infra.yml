# Local infrastructure: PostgreSQL + Redis
# Usage:
#   Daily business stack: docker compose up -d
#   Start infrastructure only: docker compose -p webhookwise --env-file .env -f deploy/compose/docker-compose.infra.yml up -d
#   When using cloud services: do not start this file; set DATABASE_URL and REDIS_URL in .env to point at the cloud instances

networks:
  webhook_net:

# Container log rotation. Docker's json-file driver has NO default limit, so every
# container here grows a log file until the disk fills. Measured on the production
# host: 2.5 GB of container logs, loki at 15 MB/day and pyroscope at 13 MB/day —
# the log aggregator's own logs were the second-largest log file on the box, and
# 63% of Grafana's lines were one message repeating every 30 seconds.
#
# 10m x 3 caps each service at 30 MB. Kept small deliberately: these files are the
# copy of last resort. Alloy already ships logs to Loki, so anything worth keeping
# is kept there, and what remains here is what you read when Loki is what broke.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: webhook-postgres
    restart: unless-stopped
    # Preload pg_stat_statements for slow-query visibility; the extension itself
    # is created operationally (CREATE EXTENSION) once the library is loaded here.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhooks}
      POSTGRES_USER: ${POSTGRES_USER:-webhook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - webhookwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook_user} -d ${POSTGRES_DB:-webhooks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook_net

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: webhook-redis
    restart: unless-stopped
    # AOF (everysec) bounds crash loss to ~1s of writes. maxmemory is capped
    # below the 256MB container limit and noeviction makes writes fail loudly
    # instead of silently evicting queued Stream entries or being OOM-killed.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - webhookwise_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook_net

volumes:
  webhookwise_postgres_data:
    name: webhookwise_postgres_data
  webhookwise_redis_data:
    name: webhookwise_redis_data
