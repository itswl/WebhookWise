global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The deep-analysis investigator (hookstack_net). Its deliveries once failed
  # in ways only its own logs could see; these gauges put it under the same
  # alerting as everything else. /metrics is unauthenticated by design —
  # counts and a dollar figure, reachable only on the private network.
  - job_name: hookprobe
    static_configs:
      - targets: ["hookprobe:8088"]

  # The shadow pair (hookstack_net). The relay left the alert path on
  # 2026-08-07; it came BACK on 2026-08-17 as the shadow run — real traffic,
  # ledger-only, accumulating judge-vs-platform agreement data. A dead shadow
  # costs no notifications, but it silently stops the comparison ledger, so it
  # gets the same scrape as everything else.
  # Both /metrics endpoints require the service's read token since the
  # 2026-08-17 hardening. The credential is a mounted file, never inline: this
  # file is in a public repository. A missing file fails only its own scrape.
  - job_name: hookrelay-shadow
    authorization:
      credentials_file: /etc/prometheus/hookrelay.token
    static_configs:
      - targets: ["hookrelay:8100"]

  - job_name: hookjudge-shadow
    authorization:
      credentials_file: /etc/prometheus/hookjudge.token
    static_configs:
      - targets: ["hookjudge:8200"]
