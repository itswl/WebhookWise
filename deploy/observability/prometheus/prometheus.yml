global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The deep-analysis investigator (hookstack_net). Its deliveries once failed
  # in ways only its own logs could see; these gauges put it under the same
  # alerting as everything else. /metrics is unauthenticated by design —
  # counts and a dollar figure, reachable only on the private network.
  - job_name: hookprobe
    static_configs:
      - targets: ["hookprobe:8088"]

  # The hookrelay scrape job was removed on 2026-08-07 when the relay was taken
  # out of the alert path and stopped. Restore it, and the hookrelay-alerts group
  # in alerts.yml, from git history if the relay goes back in front.
