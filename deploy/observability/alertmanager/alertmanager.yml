global:
  resolve_timeout: 5m

route:
  receiver: webhookwise-local
  routes:
    # An alert about the front door cannot travel THROUGH the front door.
    # These go straight to the chat bot, bypassing hookrelay and WebhookWise
    # both — the same reasoning as the relay's own dead-letter self-alarm.
    - matchers:
        - bypass_relay="true"
      receiver: chat-direct
      continue: false
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Direct to the chat bot: no relay, no brain, nothing that could be the
  # thing that broke.
  #
  # url_file, not a dollar-brace reference. Alertmanager does not expand
  # environment variables in its config and compose does not substitute inside a
  # bind-mounted file, so that form was read literally and rejected — "unsupported
  # scheme" — which meant this container could not start at all. It survived on a
  # configuration loaded before the change and died the next time it was
  # recreated, three weeks later. A bypass path is exactly the thing that must
  # not be discovered broken during the outage it exists for.
  #
  # The file holds a chat webhook token, so it is git-ignored and written by the
  # deploy from ALERT_BYPASS_WEBHOOK_URL. See deploy/observability/README.md.
  - name: chat-direct
    webhook_configs:
      - url_file: /etc/alertmanager/bypass-url
        send_resolved: true
        max_alerts: 5

  - name: webhookwise-local
    webhook_configs:
      # Alerts enter through the hookrelay front door (transparent edge:
      # raw payload forwarded into WW's own ingest, now HMAC-signed in the
      # relay→WW hop). Running this stack WITHOUT hookrelay? Point back at
      # http://webhook-service:8000/v1/webhook/alertmanager directly.
      - url: http://hookrelay:8100/hook/alertmanager
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
