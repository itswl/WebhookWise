name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker_e2e: ${{ steps.filter.outputs.docker_e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker_e2e:
              - ".github/workflows/ci.yml"
              - "Dockerfile"
              - "deploy/compose/**"
              - "entrypoint.sh"
              - "alembic/**"
              - "scripts/run_migrations.py"
              - "models/**"
              - "db/**"
              - "core/config/**"
              - "core/redis_client.py"
              - "core/retry_policies.py"
              - "core/taskiq_broker.py"
              - "contracts/**"
              - "api/v1/forwarding.py"
              - "api/v1/webhook.py"
              - "schemas/forwarding.py"
              - "schemas/webhook.py"
              - "services/forwarding/**"
              - "services/operations/**"
              - "services/webhooks/**"
              - "tests/e2e/**"
              - "requirements*.txt"
              - "requirements*.lock"

  # Unit job runs the SOURCE floor (3.12), which keeps scripts/gate.sh an exact
  # local replica. Production's 3.14 runtime is covered by docker-e2e, which
  # builds the real image — so both versions are actually exercised.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      # Persist mypy's incremental cache across runs, keyed on the Python version
      # plus the dependency locks and mypy config so it invalidates when they change.
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('requirements.lock', 'requirements-dev.lock', 'pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m compileall -q .
      - run: ruff check .
      - run: ruff format --check .
      # shellcheck ships pre-installed on GitHub-hosted ubuntu runners.
      # Node ships pre-installed on GitHub-hosted ubuntu runners.
      - run: node tests/frontend/run-all.mjs
      - run: npx --yes eslint@9.39.2 templates/static/js
      - run: shellcheck entrypoint.sh tests/e2e/run_webhook_to_feishu.sh tests/e2e/run_feishu_card_actions.sh
      - run: python scripts/check_requirements_locks.py
      # Decision records keep their shape, or the practice decays into a folder.
      - run: python scripts/assert_agent_notes.py
      # Public repository: a real project/bucket/service/team-handle/hostname
      # or webhook token must fail here, not be found in an audit later.
      - run: python scripts/assert_no_estate_identifiers.py
      - run: mypy
      - run: bandit -r core api services models adapters db scripts contracts -x tests -q -s B106
      - run: pip-audit -r requirements.lock -r requirements-dev.lock
      - run: python scripts/observability/webhookwise_observe.py contract
      # The importance verdict is what routes and silences alerts, so a change
      # that lowers it must fail here rather than in somebody's pager gap.
      # Deterministic and offline: rule engine, committed keyword defaults.
      - run: python scripts/eval_analysis.py run
      # The committed OpenAPI export must match the live route table — new
      # endpoints regenerate build/openapi via scripts/export_openapi.py.
      - run: python scripts/export_openapi.py --check
        env:
          DATABASE_URL: postgresql+asyncpg://webhook_user:ci-placeholder@localhost:5432/webhooks_ci
      # -n auto parallelizes across runner cores; pytest-cov combines per-worker
      # coverage before evaluating --cov-fail-under.
      # --dist loadfile keeps each test file's tests on one worker in collection
      # order. Some analysis/forwarding tests carry module-scoped state that the
      # suite handles in-order (a single-process run is green) but the default
      # `load` scheduler can interleave across workers into a leaking order.
      # loadfile pins that boundary; the residual isolation debt is tracked
      # separately.
      - run: pytest -n auto --dist loadfile -q --cov=core --cov=api --cov=services --cov=models --cov=adapters --cov=db --cov=contracts --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=85

  integration:
    # Real-backend semantics (actual PostgreSQL + Redis): the classes of bug
    # that SQLite/mocks structurally cannot catch (VARCHAR limits, FOR UPDATE,
    # Lua execution). Small suite, tests/real_infra/, env-gated collection.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: webhookwise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d webhookwise_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - run: pytest -q tests/real_infra/
        env:
          REAL_INFRA_TESTS: "1"
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/webhookwise_ci
          REDIS_URL: redis://localhost:6379/0

  docker-e2e:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || needs.changes.outputs.docker_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the app image once with a persistent GHA layer cache and load it
      # into the local daemon under the exact tag the compose file references, so
      # the e2e run reuses it (E2E_SKIP_BUILD=1) instead of rebuilding from scratch.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: webhookwise-e2e:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: E2E_SKIP_BUILD=1 tests/e2e/run_webhook_to_feishu.sh
      # Each script owns its stack lifecycle (down -v up front and in its EXIT
      # trap), so the runs share the built image but never share state.
      - run: E2E_SKIP_BUILD=1 tests/e2e/run_feishu_card_actions.sh
